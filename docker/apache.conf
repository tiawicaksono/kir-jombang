ServerName localhost
<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    <LocationMatch "^/(protected|vendor|yii|docker|deploy|tests|\.git|\.github|\.agents|\.codex)(/|$)">
        Require all denied
    </LocationMatch>
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>
    <DirectoryMatch "^/var/www/html/(protected|vendor|yii|docker|deploy|tests|\.git|\.github|\.agents|\.codex)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "(^\.|\.(md|json|lock|ya?ml|sql|ini|sh|log)$|^Dockerfile$)">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "^/var/www/html/(uploads|downloadsfile|images|assets|template_laporan)(/|$)">
        <FilesMatch "\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>
</VirtualHost>
