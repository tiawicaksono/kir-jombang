name: Staging
on:
  push:
    branches: [staging]
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t app-test .
      - name: Runtime and library smoke tests
        run: docker run --rm app-test php tests/smoke/runtime.php
      - name: Dashboard empty-data regression
        run: docker run --rm app-test php tests/smoke/dashboard.php
      - name: HTTP and access boundary smoke tests
        run: bash tests/smoke/container.sh app-test
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Set variables
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO=$REPO" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build Image
        run: docker build -t "ghcr.io/$REPO:$IMAGE_TAG" -t "ghcr.io/$REPO:staging" .
      - name: Push Images
        run: |
          docker push "ghcr.io/$REPO:$IMAGE_TAG"
          docker push "ghcr.io/$REPO:staging"
