name: Staging app-031-uji-kir
on:
  push:
    branches: [staging]
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image including development dependencies
        run: docker build --target test -t app-test .
      - name: Run Laravel tests
        run: docker run --rm -e APP_ENV=testing -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= app-test
      - name: Smoke test production runtime
        shell: bash
        run: |
          set -euo pipefail
          docker build --target production -t app-runtime .
          trap 'docker logs app-smoke; docker rm -f app-smoke' EXIT
          docker run -d --name app-smoke \
            -e APP_ENV=testing \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e CACHE_STORE=file -e SESSION_DRIVER=file -e QUEUE_CONNECTION=sync \
            -e LOG_CHANNEL=stderr app-runtime
          for attempt in $(seq 1 30); do
            if docker exec app-smoke curl --fail --silent http://127.0.0.1:8000/up; then
              docker exec app-smoke curl --fail --silent --output /dev/null http://127.0.0.1:8000/
              exit 0
            fi
            sleep 3
          done
          exit 1
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: image
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/$repo" >> "$GITHUB_OUTPUT"
          echo "release=staging-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:staging
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.release }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging
