name: Build app-031-uji-kir
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Set variables
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO=$REPO" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build Image
        run: docker build -t "ghcr.io/$REPO:$IMAGE_TAG" -t "ghcr.io/$REPO:latest" .
      - name: Push Images
        run: |
          docker push "ghcr.io/$REPO:$IMAGE_TAG"
          docker push "ghcr.io/$REPO:latest"
